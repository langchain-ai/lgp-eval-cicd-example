name: Comprehensive Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  # Route every job through the LangSmith LLM Gateway.
  LLM_PROVIDER: gateway
  LLM_GATEWAY_BASE_URL: ${{ vars.LLM_GATEWAY_BASE_URL || 'https://gateway.smith.langchain.com/v1' }}
  LLM_MODEL: ${{ vars.LLM_MODEL || 'anthropic/claude-sonnet-5' }}
  # Namespaces the dataset and experiment names. See agents/config.py.
  DEMO_OWNER: ${{ vars.DEMO_OWNER }}

jobs:
  quality-checks:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # pre-commit compares against the base revision
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Run linting and formatting checks
        run: make lint
      - name: Run pre-commit hooks
        run: make pre-commit

  # Offline suites only -- see the `test` target. e2e and evaluations run in
  # their own jobs so that a missing credential cannot block work that needs none.
  test-coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Run tests with coverage
        run: make test

  # Verifies the control plane client builds the right request for both the
  # SaaS and self-hosted hosting models. Runs fully offline against a mocked
  # control plane, so it needs no credentials.
  deployment-tests:
    name: Deployment client
    needs: [quality-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Run deployment tests
        run: uv run pytest tests/deployment/ --junitxml=deployment-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deployment-test-results
          path: deployment-results.xml

  unit-tests:
    name: Unit tests
    needs: [quality-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Run unit tests
        run: uv run pytest tests/unit/ --junitxml=unit-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: unit-results.xml

  integration-tests:
    name: Integration tests
    needs: [quality-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Run integration tests
        run: uv run pytest tests/integrations/ --junitxml=integration-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: integration-results.xml

  e2e-tests:
    name: End-to-end tests
    needs: [quality-checks, test-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
      LLM_MODEL: openai/gpt-4o
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Run e2e tests
        run: uv run pytest tests/e2e/ --junitxml=e2e-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-test-results
          path: e2e-results.xml

  evaluation-tests:
    name: Offline evaluations
    needs: [quality-checks, test-coverage]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'true' }}
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Run offline evaluations
        run: uv run pytest -m evaluator --junitxml=evaluator-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evaluation-test-results
          path: evaluator-results.xml
      - name: Upload LangSmith evaluation configs
        uses: actions/upload-artifact@v7
        with:
          name: langsmith-eval-configs
          path: evaluation_config__*.json

  evaluation-report:
    name: Evaluation report
    needs: evaluation-tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Download LangSmith evaluation configs
        uses: actions/download-artifact@v8
        with:
          name: langsmith-eval-configs
      - name: Build the evaluation report
        run: uv run python .github/scripts/report_eval.py --verbose evaluation_config__*.json
      - name: Comment on the PR with the evaluation summary
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('eval_comment.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # Final gate: the graph has to actually serve before anything is deployed.
  langgraph-dev-test:
    name: Agent Server smoke test
    needs: [unit-tests, integration-tests, e2e-tests, deployment-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync

      - name: Start the Agent Server
        run: |
          echo "🚀 Starting the local Agent Server..."
          uv run langgraph dev --host 127.0.0.1 --port 2024 --no-browser --no-reload \
            > langgraph-dev.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for the server to become healthy
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:2024/ok | jq -e '.ok == true' > /dev/null 2>&1; then
              echo "✅ Server healthy after ${attempt} attempt(s)."
              exit 0
            fi
            echo "⏳ Attempt ${attempt}/30: not ready yet..."
            sleep 2
          done
          echo "❌ Server never became healthy. Logs:"
          cat langgraph-dev.log
          exit 1

      - name: Check the graph is registered
        run: |
          echo "🔍 Fetching registered assistants..."
          curl -fsS -X POST http://127.0.0.1:2024/assistants/search \
            -H 'Content-Type: application/json' \
            -d '{"limit": 10}' | jq -e '[.[] | .graph_id] | index("simple_text2sql")' \
            || { echo "❌ simple_text2sql graph is not registered"; cat langgraph-dev.log; exit 1; }
          echo "✅ simple_text2sql graph is registered."

      - name: Stop the Agent Server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: langgraph-dev-log
          path: langgraph-dev.log

  # Only deploy a preview once every test above has passed. Invoked as a
  # reusable workflow so it runs in this pull request's context rather than
  # through `workflow_run`, which would expose secrets to fork pull requests.
  preview-deployment:
    name: Preview deployment
    needs: [langgraph-dev-test, evaluation-report]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # A reusable workflow cannot request more than the job calling it holds.
    # preview-deployment.yml needs pull-requests: write to post its status
    # comment, so the caller has to grant it here -- the workflow-level default
    # of contents: read alone makes GitHub reject the run at startup.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/preview-deployment.yml
    secrets: inherit
