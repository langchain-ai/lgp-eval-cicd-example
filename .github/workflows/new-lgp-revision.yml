name: Production Deployment & Cleanup

# When a pull request closes, tear down its preview. If it was merged, cut a new
# production revision from main.
on:
  pull_request:
    branches: [main]
    types: [closed]

env:
  PYTHON_VERSION: '3.11'
  # Set the LANGSMITH_DEPLOYMENT_TARGET repository variable to `saas` or
  # `self-hosted`. SaaS builds from this repository; self-hosted deploys a
  # Docker image that this workflow builds and pushes.
  DEPLOYMENT_TARGET: ${{ vars.LANGSMITH_DEPLOYMENT_TARGET || 'saas' }}
  # Keep this short: self-hosted caps deployment names at 21 characters,
  # because KEDA derives an HPA name from it that must fit in 63.
  # An explicit prefix wins; otherwise it derives from DEMO_OWNER.
  DEPLOYMENT_NAME_PREFIX: ${{ vars.DEPLOYMENT_NAME_PREFIX || (vars.DEMO_OWNER && format('text2sql-{0}', vars.DEMO_OWNER)) || 'text2sql' }}
  REGISTRY: ${{ vars.REGISTRY || 'docker.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

permissions:
  contents: read

jobs:
  # Previews are never created for fork pull requests (a fork has no access to
  # the deployment credentials), so there is nothing to clean up for one.
  cleanup-preview:
    name: Delete preview deployment
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Delete the preview deployment
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_WORKSPACE_ID: ${{ secrets.LANGSMITH_WORKSPACE_ID }}
          CONTROL_PLANE_HOST: ${{ secrets.CONTROL_PLANE_HOST }}
          LANGSMITH_REGION: ${{ vars.LANGSMITH_REGION || 'us' }}
        run: |
          uv run python .github/scripts/langgraph_api.py \
            --target "$DEPLOYMENT_TARGET" \
            --action cleanup-preview \
            --pr-number "$PR_NUMBER"

  # Self-hosted LangSmith runs an image you supply. SaaS skips this job and has
  # the control plane build from the merge commit instead.
  build-production-image:
    name: Build production image (self-hosted only)
    needs: cleanup-preview
    if: >-
      github.event.pull_request.merged == true &&
      (vars.LANGSMITH_DEPLOYMENT_TARGET || 'saas') == 'self-hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-
          labels: |
            org.opencontainers.image.title=Text2SQL Agent
            org.opencontainers.image.description=Text-to-SQL agent built with LangGraph

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfiles/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to production
    needs: [cleanup-preview, build-production-image]
    # `always()` so the SaaS path still runs when the image job is skipped.
    #
    # Deliberately NOT gated on cleanup-preview succeeding. Deleting the
    # preview is housekeeping; failing to delete it is not a reason to withhold
    # a merged change from production. The build is a real gate, so that still
    # blocks.
    if: >-
      always() &&
      github.event.pull_request.merged == true &&
      needs.build-production-image.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Credentials are passed through the environment, never on the command
      # line, so they cannot appear in the rendered command in workflow logs.
      - name: Deploy to production
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_WORKSPACE_ID: ${{ secrets.LANGSMITH_WORKSPACE_ID }}
          LANGSMITH_GITHUB_INTEGRATION_ID: ${{ secrets.LANGSMITH_GITHUB_INTEGRATION_ID }}
          LANGSMITH_LISTENER_ID: ${{ secrets.LANGSMITH_LISTENER_ID }}
          CONTROL_PLANE_HOST: ${{ secrets.CONTROL_PLANE_HOST }}
          LANGSMITH_REGION: ${{ vars.LANGSMITH_REGION || 'us' }}
          LLM_GATEWAY_BASE_URL: ${{ vars.LLM_GATEWAY_BASE_URL || 'https://gateway.smith.langchain.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'anthropic/claude-sonnet-5' }}
          REPO_REF: ${{ github.event.pull_request.base.ref }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          uv run python .github/scripts/langgraph_api.py \
            --target "$DEPLOYMENT_TARGET" \
            --action deploy-production \
            --repo-url "$REPO_URL" \
            --repo-ref "$REPO_REF" \
            --image-uri "$REGISTRY/$IMAGE_NAME:latest" \
            --secret-env LLM_GATEWAY_BASE_URL \
            --secret-env LLM_MODEL \
            --wait

      - name: Generate deployment status report
        if: always()
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_WORKSPACE_ID: ${{ secrets.LANGSMITH_WORKSPACE_ID }}
          CONTROL_PLANE_HOST: ${{ secrets.CONTROL_PLANE_HOST }}
          LANGSMITH_REGION: ${{ vars.LANGSMITH_REGION || 'us' }}
        run: |
          uv run python .github/scripts/report_deployment.py \
            --target "$DEPLOYMENT_TARGET" \
            --deployment-name "$DEPLOYMENT_NAME_PREFIX-prod" \
            --deployment-type production

      - name: Comment on the PR with the deployment status
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('deployment_comment.md', 'utf8');
            } catch (error) {
              body = `## 🚀 Production deployment\n\nThe deployment report could not be generated: ${error.message}`;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
